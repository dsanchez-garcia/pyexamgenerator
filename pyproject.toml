[build-system]
# setuptools >= 77: licencia como expresión SPDX (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyexamgenerator"
# Fuente única de la versión: `__version__` en pyexamgenerator/__init__.py.
dynamic = ["version"]
description = "Suite de escritorio para generar, gestionar y corregir exámenes con IA."
readme = "README.md"
# Versión mínima de Python: 3.8 y 3.9 ya no tienen soporte, y google-genai exige >= 3.10 en sus
# versiones actuales. Mantener en línea con los clasificadores, tox.ini, .readthedocs.yaml y la CI.
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Sánchez-García", email = "daniel.sanchezgarcia@uca.es" }]
keywords = ["exam", "generator", "ai", "gemini", "pdf", "moodle", "quiz", "education", "test"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Topic :: Education",
    "Topic :: Text Processing",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "google-genai",
    # Successor of the abandoned PyPDF2; 6.21.2 fixes the security advisories known in October 2026
    # (long runtimes or memory use when opening a malformed PDF).
    "pypdf>=6.21.2",
    "python-docx",
    "pandas",
    "openpyxl",
    "PyMuPDF",
]

[project.optional-dependencies]
# Corrección con OCR de hojas manuscritas (subpaquete `grading`).
# Doble backend según la versión de Python:
#   - Python >= 3.13 (p. ej. 3.14): paquete nuevo `rapidocr` + numpy>=2 + opencv reciente.
#   - Python <  3.13 (3.10 a 3.12):  `rapidocr-onnxruntime` + numpy<2 + opencv<=4.10
#     (shapely de rapidocr-onnxruntime exige numpy<2).
grading = [
    "rapidocr>=2; python_version >= '3.13'",
    "onnxruntime>=1.17; python_version >= '3.13'",
    "numpy>=2; python_version >= '3.13'",
    "opencv-python>=4.8; python_version >= '3.13'",
    "rapidocr-onnxruntime>=1.3; python_version < '3.13'",
    "numpy<2; python_version < '3.13'",
    "opencv-python<=4.10.0.84; python_version < '3.13'",
]
# Tests, empaquetado y publicación. Entorno completo: pip install -e ".[dev,docs,grading]"
dev = [
    "pytest",
    "tox",
    "build",
    "twine",
    "ruff",
    "pre-commit",
    "mypy",
]
# Compilar la documentación. Read the Docs y la CI usan las versiones fijadas en docs/requirements.txt.
docs = [
    "sphinx>=8.1",
    "sphinx-rtd-theme>=3",
    "myst-parser>=4",
]

[project.urls]
Homepage = "https://github.com/dsanchez-garcia/pyexamgenerator"
"Documentación" = "https://pyexamgenerator.readthedocs.io/es/latest/"
Cambios = "https://github.com/dsanchez-garcia/pyexamgenerator/blob/master/CHANGELOG.md"
"Código fuente" = "https://github.com/dsanchez-garcia/pyexamgenerator"
Citar = "https://github.com/dsanchez-garcia/pyexamgenerator/blob/master/CITATION.cff"

[project.scripts]
pyexamgenerator = "pyexamgenerator.main_app:main"

[tool.setuptools.dynamic]
version = { attr = "pyexamgenerator.__version__" }

[tool.setuptools.packages.find]
include = ["pyexamgenerator*"]

[tool.ruff]
# Initial, permissive setup (DEV-1): only real errors for now (pyflakes, "F"). The formatter
# (`ruff format`) will be applied in a separate change without functional changes.
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
# Non-strict type checking (DEV-2), starting with the grading facade, its configs and small helpers.
# Add modules to `files` as they are typed.
python_version = "3.10"
files = [
    "pyexamgenerator/_console.py",
    "pyexamgenerator/_text.py",
    "pyexamgenerator/gui_logic.py",
    "pyexamgenerator/grading/_ids.py",
    "pyexamgenerator/grading/_paths.py",
    "pyexamgenerator/grading/_text.py",
    "pyexamgenerator/grading/api.py",
    "pyexamgenerator/grading/session.py",
]
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
# Only the project's tests (never a copy of the repository such as the OneDrive backup link).
testpaths = ["tests"]
# Show why tests were skipped (OCR without the [grading] extra, GUI without a display).
addopts = "-ra"
